# Développement local :  docker compose up -d --build
# Puis rendez-vous sur    http://localhost:8100
#
# Pour le NAS, utilisez plutôt docker-compose.synology.yml, qui récupère
# l'image déjà compilée sur ghcr.io au lieu de la construire sur place.

services:
  carburants:
    build: .
    container_name: suivi-carburants
    restart: unless-stopped
    ports:
      # Le 8000 est déjà occupé par gestion-locative : on expose sur 8100.
      # Seul le nombre de gauche change ; le conteneur écoute toujours en 8000.
      - "8100:8000"
    volumes:
      # La base de données et les modèles restent sur le NAS, pas dans le
      # conteneur : une mise à jour de l'image ne détruit donc aucune donnée.
      - ./donnees:/application/donnees
    env_file:
      # Facultatif. Créez ce fichier à partir de .env.exemple pour les alertes.
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/etat')"]
      interval: 5m
      timeout: 10s
      retries: 3
      # La première collecte dure cinq à dix minutes.
      start_period: 15m
